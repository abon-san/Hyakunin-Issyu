# v から始まるタグ（例: v0.7.0）を push すると、テストを流し、署名したリリース版の APK を GitHub Releases に上げる。
# アプリは起動時にここの最新のリリースを確かめて、新しい版を入れる（RELEASING.md）。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: タグと versionName を照らし合わせる
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と versionName $version が合いません"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Android SDK とテストに要るものをそろえる
        # ランナーに入っている SDK ではなく、決まった版の sdkmanager で入れる
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: bash tools/setup_cloud_env.sh

      - name: テスト
        run: ./gradlew testDebugUnitTest

      - name: 署名したリリース版を作る
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HYAKUNIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HYAKUNIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HYAKUNIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets に KEYSTORE_BASE64 がありません（RELEASING.md）"
            exit 1
          fi
          export HYAKUNIN_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HYAKUNIN_KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm "$HYAKUNIN_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "hyakunin-issyu-$VERSION.apk"

      - name: GitHub Releases に上げる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout はタグを軽量タグとして取ってくるので、注記つきのタグを取り直す
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "hyakunin-issyu-$VERSION.apk" \
            --title "Ver. $VERSION" \
            --notes-file notes.md
